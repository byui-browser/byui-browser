[package]
name = "net"
description = "Rust Fetch engine for HTTP(S) requests and filtered responses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
common = { workspace = true }
bytes = "1"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip", "brotli", "deflate", "zstd"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2"

[lints]
workspace = true
