[package]
name = "browser"
description = "Top-level browser binary that wires processes and crates together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "browser"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
common = { workspace = true }
html = { workspace = true }
css = { workspace = true }
layout = { workspace = true }
paint = { workspace = true }
render = { workspace = true }
js = { workspace = true }
webapis = { workspace = true }
net = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
storage = { workspace = true }
security = { workspace = true }
chrome = { workspace = true }
devtools = { workspace = true }
futures-util = "0.3"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[dev-dependencies]
cap-std = "4"

[lints]
workspace = true
