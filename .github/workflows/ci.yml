name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for a PR when new commits land; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the selected channel and
      # its rustfmt/clippy components on first cargo invocation.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

  # Discover every workspace package so new crates automatically receive checks.
  crates:
    name: workspace crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover workspace crates
        id: discover
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/workspace.json"
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "workspace.json").read_text())
          members = set(metadata["workspace_members"])
          crates = sorted(package["name"] for package in metadata["packages"] if package["id"] in members)
          print("matrix=" + json.dumps(crates))
          PYTHON

  test:
    name: test (${{ matrix.crate }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: crates
    strategy:
      # Report every crate's result even when another crate fails.
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.matrix) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --package "${{ matrix.crate }}"
        shell: bash

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Required status check for `main`. The branch ruleset requires the context
  # "lint, test", so this aggregate gate keeps that name stable while the jobs
  # above are free to change. Add new jobs to `needs` to make them blocking.
  gate:
    name: lint, test
    runs-on: ubuntu-latest
    needs: [crates, lint, test, audit]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: needs.crates.result != 'success' || needs.lint.result != 'success' || needs.test.result != 'success' || needs.audit.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "every required job succeeded"
