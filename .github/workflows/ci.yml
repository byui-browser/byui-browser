name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for a PR when new commits land; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the selected channel and
      # its rustfmt/clippy components on first cargo invocation.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

  # One job per OS keeps the checks list short. Each job tests every workspace
  # crate separately and reports per-crate results in the run summary, with an
  # error annotation naming each crate that failed.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      # Report every OS's result even when another OS fails.
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Crates come from `cargo metadata`, so new workspace members are tested
      # automatically. A failing crate does not stop the remaining crates.
      - name: Test each workspace crate
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
        run: |
          crates=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | tr -d '\r' | sort)
          {
            echo "### Tests on $OS_NAME"
            echo
            echo "| Crate | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=()
          for crate in $crates; do
            echo "::group::cargo test --package $crate"
            if cargo test --package "$crate"; then
              result="pass"
            else
              result="**FAIL**"
              failed+=("$crate")
            fi
            echo "::endgroup::"
            if [ "$result" != "pass" ]; then
              echo "::error title=$crate tests failed on $OS_NAME::Reproduce with: cargo test --package $crate"
            fi
            echo "| \`$crate\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed crates: ${failed[*]}"
            exit 1
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Required status check for `main`. The branch ruleset requires the context
  # "lint, test", so this aggregate gate keeps that name stable while the jobs
  # above are free to change. Add new jobs to `needs` to make them blocking.
  gate:
    name: lint, test
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: needs.lint.result != 'success' || needs.test.result != 'success' || needs.audit.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "every required job succeeded"
