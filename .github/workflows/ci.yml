name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for a PR when new commits land; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the selected channel and
      # its rustfmt/clippy components on first cargo invocation.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

  # One job per OS keeps the checks list short. Each job tests every workspace
  # crate separately. The run summary lists every test that ran per crate; a
  # failing crate's output is printed unfolded in the log and its failing tests
  # are named in an error annotation.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      # Report every OS's result even when another OS fails.
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Crates come from `cargo metadata`, so new workspace members are tested
      # automatically. A failing crate does not stop the remaining crates.
      - name: Test each workspace crate
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
        run: |
          crates=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name' | tr -d '\r' | sort)
          work=$(mktemp -d)
          strip_color=$'s/\x1b\\[[0-9;]*m//g'
          {
            echo "### Tests on $OS_NAME"
            echo
            echo "| Crate | Result | Passed | Failed | Ignored |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=()
          for crate in $crates; do
            log="$work/$crate.log"
            tests="$work/$crate.tests"

            # Passing output stays folded; `tee` keeps it streaming while it runs.
            echo "::group::cargo test --package $crate"
            if cargo test --package "$crate" 2>&1 | tee "$log"; then
              result="pass"
            else
              result="**FAIL**"
              failed+=("$crate")
            fi
            echo "::endgroup::"

            sed "$strip_color" "$log" | tr -d '\r' > "$log.plain"
            grep -E '^test .* \.\.\. ' "$log.plain" > "$tests" || true
            read -r passed broken ignored < <(awk '
              / \.\.\. ok$/ { p++ } / \.\.\. FAILED$/ { f++ } / \.\.\. ignored/ { i++ }
              END { print p + 0, f + 0, i + 0 }' "$tests")
            echo "| \`$crate\` | $result | $passed | $broken | $ignored |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$result" = "pass" ]; then
              open=""
            else
              open=" open"
              # Repeat the failure outside the folded group so it is visible on arrival.
              echo "---- $crate failed on $OS_NAME ----"
              if grep -q '^failures:$' "$log.plain"; then
                sed -n '/^failures:$/,/^test result:/p' "$log.plain"
                names=$(sed -n 's/^test \(.*\) \.\.\. FAILED$/\1/p' "$tests" | head -n 10 | paste -sd ' ' -)
                detail="$broken failed: $names."
              else
                tail -n 60 "$log.plain"
                detail="Did not build or exited before any test failed."
              fi
              echo "::error title=$crate tests failed on $OS_NAME::$detail Reproduce with: cargo test --package $crate"
            fi

            {
              echo
              echo "<details$open><summary><code>$crate</code>: $passed passed, $broken failed, $ignored ignored</summary>"
              echo
              echo '```text'
              if [ -s "$tests" ]; then cat "$tests"; else echo "(no tests ran)"; fi
              echo '```'
              echo
              echo "</details>"
            } >> "$work/details.md"
          done

          cat "$work/details.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed crates: ${failed[*]}"
            exit 1
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Required status check for `main`. The branch ruleset requires the context
  # "lint, test", so this aggregate gate keeps that name stable while the jobs
  # above are free to change. Add new jobs to `needs` to make them blocking.
  gate:
    name: lint, test
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        if: needs.lint.result != 'success' || needs.test.result != 'success' || needs.audit.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "every required job succeeded"
