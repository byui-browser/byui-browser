# cargo-deny configuration — dependency advisories, licenses, and sources.
# Enforced by the `audit` job in .github/workflows/ci.yml (architecture §5).
#
# Run locally with: cargo deny check

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT license.
# Add to this list only with Security & Storage team review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
