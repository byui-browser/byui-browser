[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/html",
    "crates/css",
    "crates/layout",
    "crates/paint",
    "crates/render",
    "crates/js",
    "crates/webapis",
    "crates/net",
    "crates/storage",
    "crates/security",
    "crates/chrome",
    "crates/devtools",
    "crates/browser",
    "platforms/shell",
    "platforms/macos",
    "platforms/windows",
    "platforms/linux",
    "platforms/js",
]
default-members = ["crates/browser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/byui-cse/byui-browser"
rust-version = "1.88"

[workspace.dependencies]
common = { path = "crates/common" }
html = { path = "crates/html" }
css = { path = "crates/css" }
layout = { path = "crates/layout" }
paint = { path = "crates/paint" }
render = { path = "crates/render" }
js = { path = "crates/js" }
webapis = { path = "crates/webapis" }
net = { path = "crates/net" }
storage = { path = "crates/storage" }
security = { path = "crates/security" }
chrome = { path = "crates/chrome" }
devtools = { path = "crates/devtools" }
tao = "0.30"
wry = "0.47"
# Logging facade used by every crate; `common::logging` installs the logger.
log = { version = "0.4", features = ["std"] }
psl = "2"

[workspace.lints.rust]
unsafe_code = "warn"

# The native shells paint every frame on the UI thread, so keep their drawing
# code optimized in dev builds; unoptimized software rasterizing makes window
# drags and hover feedback lag.
[profile.dev.package.browser-shell]
opt-level = 3

# The page is rasterized again on every scroll step.
[profile.dev.package.render]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.ab_glyph]
opt-level = 3

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3

[profile.dev.package.owned_ttf_parser]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

# Image decoding and SVG rasterizing run on page load and when an image is
# first painted at a new size; unoptimized, a photo takes seconds to decode.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3
